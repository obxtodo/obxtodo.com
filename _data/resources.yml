- category: "Parks & History"
  links:
    - title: "National Park Service (OBX)"
      url: "https://www.nps.gov/caha/index.htm"
      desc: "The go-to for Cape Hatteras National Seashore alerts and lighthouse climbing tickets."
    - title: "The Lost Colony"
      url: "https://thelostcolony.org/"
      desc: "Official site for the historic outdoor drama on Roanoke Island."
    - title: "Jockey's Ridge State Park"
      url: "https://www.ncparks.gov/state-parks/jockeys-ridge-state-park"
      desc: "Home to the tallest living sand dune system on the Atlantic coast. Ideal for hiking, hang gliding, and sunset views over the Roanoke Sound."
    - title: "Wright Brothers National Memorial"
      url: "https://www.nps.gov/wrbr/index.htm"
      desc: "The site of the first successful powered flight. Features the historic sand dunes, a commemorative monument, and a museum detailing the 1903 achievement."
    - title: "Pea Island National Wildlife Refuge"
      url: "https://www.fws.gov/refuge/pea-island"
      desc: "A 13-mile sanctuary located on the north end of Hatteras Island. It is a premier location for birdwatching and exploring untouched coastal ecosystems."